<body class="bg-background min-h-screen flex items-center justify-center p-margin-desktop">
<main class="w-full max-w-md bg-surface-container-lowest border border-surface-variant rounded-xl shadow-[0px_4px_12px_rgba(0,0,0,0.1)] overflow-hidden">
<div class="p-card-padding flex flex-col items-center border-b border-surface-variant">
<div class="mb-4 flex items-center justify-center overflow-hidden">
<img alt="OccupaControl Logo" class="w-12 h-12 object-contain" src="https://lh3.googleusercontent.com/aida/AP1WRLvEck_6h265t-gNtxbzeamcgtbSZ0D1ahG5KA-Dt3FOVgovd5cx0RvRr7_ZN8GnbcQj0skrAyzBQDBEUIzLlj9J0LuXXzboCRsFQjd4Tepn7Vp6vJFpzYrAPJuGLnuV2nvxza_tsrf3229fCN_JKdJJxSLsGf9zooDHSIVR1sskgs932KgTWkJSjrrNJTMI8fjT5PKt4mVX3QkMJkv2Gvw7xM24HXt2v5gde0lEbnaCWq0V4kvuwfJzHggp"/>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface">OccupaControl</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-1">Acesso ao Painel de Controle</p>
</div>
<div class="p-card-padding">
<div class="bg-error-container border border-error rounded-lg p-3 mb-6 flex items-center gap-3" role="alert">
<span class="material-symbols-outlined text-error" data-icon="error" data-weight="fill" style="font-variation-settings: 'FILL' 1;">error</span>
<p class="font-body-md text-body-md text-on-error-container font-medium">Usuário ou senha incorretos</p>
</div>
<form action="#" class="space-y-4" method="POST">
<div class="space-y-1">
<label class="font-label-lg text-label-lg text-on-surface block" for="username">Usuário</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant" data-icon="person">person</span>
<input class="w-full pl-10 pr-3 py-2 bg-surface border border-outline rounded-DEFAULT font-body-md text-body-md text-on-surface focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors" id="username" name="username" placeholder="Seu e-mail corporativo" required="" type="email" value="admin@occupacontrol.com"/>
</div>
</div>
<div class="space-y-1">
<label class="font-label-lg text-label-lg text-on-surface block" for="password">Senha</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant" data-icon="lock">lock</span>
<input class="w-full pl-10 pr-3 py-2 bg-surface border border-error rounded-DEFAULT font-body-md text-body-md text-on-surface focus:outline-none focus:ring-1 focus:ring-error focus:border-error transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<div class="flex items-center justify-between pt-2 pb-4">
<div class="flex items-center gap-2">
<input class="w-4 h-4 text-primary bg-surface border-outline rounded focus:ring-primary focus:ring-2" id="remember" type="checkbox"/>
<label class="font-label-sm text-label-sm text-on-surface-variant" for="remember">Lembrar-me</label>
</div>
<a class="font-label-sm text-label-sm text-primary hover:underline" href="esqueci_senha.html">Esqueci a senha</a>
</div>
<button class="w-full bg-[#C27933] hover:bg-primary text-on-primary font-label-lg text-label-lg py-3 rounded-lg transition-colors flex justify-center items-center" type="submit">
            Entrar
        </button>
</form>
</div>
<div class="bg-surface-container-low p-4 text-center border-t border-surface-variant">
<p class="font-label-sm text-label-sm text-on-surface-variant">Precisa de ajuda? <a class="text-primary hover:underline" href="mailto:suporte@occupacontrol.com">Contate o Suporte TI</a></p>
</div>
